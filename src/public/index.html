<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireFlow</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <strong>HireFlow</strong>
        <span id="sessionInfo"></span>
      </div>
      <nav>
        <button data-view="home">Home</button>
        <button data-view="jobs">Jobs</button>
        <button data-view="profile">Profile</button>
        <button data-view="company">Create Company</button>
        <button data-view="jobForm" class="companyOnly">Create Job</button>
        <button data-view="hr" class="companyOnly">HR Review</button>
        <button data-view="skills">Skills</button>
        <button data-view="departments" class="companyOnly">Departments</button>
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main>
      <section id="authView" class="grid two">
        <form id="loginForm" class="panel">
          <h2>Login</h2>
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <form id="registerForm" class="panel">
          <h2>Register</h2>
          <input name="name" placeholder="Full name" required />
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Register</button>
        </form>
      </section>

      <section id="home" class="view panel">
        <h1>Dashboard</h1>
        <div id="homeSummary" class="summary"></div>
      </section>

      <section id="jobs" class="view">
        <div class="sectionHead">
          <h1>Jobs</h1>
          <button id="refreshJobs">Refresh</button>
        </div>
        <div id="jobsList" class="list"></div>
      </section>

      <section id="profile" class="view panel">
        <h1>Candidate Profile</h1>
        <form id="profileForm" class="formGrid">
          <input name="phone" placeholder="Phone" />
          <input name="location" placeholder="Location" />
          <input name="education" placeholder="Education" />
          <input name="experienceYears" type="number" min="0" placeholder="Experience years" />
          <label class="fileField">
            <span>CV file</span>
            <input name="cvFile" type="file" accept=".pdf,.doc,.docx" />
          </label>
          <div id="currentCv" class="meta fullRow"></div>
          <input name="githubUrl" placeholder="GitHub URL" />
          <input name="linkedinUrl" placeholder="LinkedIn URL" />
          <select name="skills" multiple></select>
          <textarea name="bio" placeholder="Bio"></textarea>
          <button type="submit">Save Profile</button>
        </form>
      </section>

      <section id="company" class="view panel">
        <h1>Create Company</h1>
        <form id="companyForm" class="formGrid">
          <input name="name" placeholder="Company name" required />
          <input name="email" type="email" placeholder="Company email" required />
          <input name="phone" placeholder="Phone" />
          <input name="location" placeholder="Location" />
          <textarea name="description" placeholder="Description"></textarea>
          <button type="submit">Create Company</button>
        </form>
      </section>

      <section id="jobForm" class="view panel">
        <h1>Create Job</h1>
        <form id="createJobForm" class="formGrid">
          <input name="title" placeholder="Title" required />
          <input name="location" placeholder="Location" />
          <select name="employmentType" required>
            <option value="">Employment type</option>
            <option>FULL_TIME</option>
            <option>PART_TIME</option>
            <option>INTERNSHIP</option>
            <option>CONTRACT</option>
          </select>
          <input name="salaryMin" type="number" placeholder="Salary min" />
          <input name="salaryMax" type="number" placeholder="Salary max" />
          <input name="deadline" type="date" />
          <select name="departmentId"></select>
          <select name="skills" multiple></select>
          <textarea name="description" placeholder="Description" required></textarea>
          <textarea name="requirements" placeholder="Requirements, one per line"></textarea>
          <button type="submit">Create Job</button>
        </form>
      </section>

      <section id="hr" class="view">
        <div class="sectionHead">
          <h1>HR Review</h1>
          <button id="refreshApplications">Refresh</button>
        </div>
        <div id="applicationsList" class="list"></div>
      </section>

      <section id="skills" class="view panel">
        <h1>Skills</h1>
        <form id="skillForm" class="inlineForm">
          <input name="name" placeholder="Skill name" required />
          <select name="category">
            <option>TECHNICAL</option>
            <option>SOFT</option>
            <option>LANGUAGE</option>
            <option>TOOL</option>
          </select>
          <button type="submit">Add</button>
        </form>
        <div id="skillsList" class="chips"></div>
      </section>

      <section id="departments" class="view panel">
        <h1>Departments</h1>
        <form id="departmentForm" class="inlineForm">
          <input name="name" placeholder="Department name" required />
          <button type="submit">Add</button>
        </form>
        <div id="departmentsList" class="chips"></div>
      </section>

      <pre id="message"></pre>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
